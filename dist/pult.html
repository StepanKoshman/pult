<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пульт LT1, DM40, tinySA и C2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Saira+Semi+Condensed:wght@500;600&display=swap">
<style>/* Концепция: стенд с модулями в стойке. Рамка приборной панели, гравированные подписи,
   тёмное стекло индикатора внутри каждого модуля. Цвета задаёт выбранная тема. */
:root {
  --bg: #0E1418; --panel: #162026; --raised: #1F2C34; --line: #2D3D47; --ink: #E8EEF2; --ink2: #A8B8C3; --ink3: #74868F;
  --accent: #F0A63A; --on-accent: #201505; --screen: #0A0F12; --screen-ink: #FFC46B; --grid: #22313A;
  --t1: #F2C14E; --t2: #54C6F0; --t3: #F27BB5; --t4: #86DE97;
  --ok: #4CC38A; --warn: #E8B339; --bad: #F2645A;
  --f-ui: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, "Noto Sans", sans-serif;
  --f-label: "IBM Plex Sans Condensed", "Arial Narrow", "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", "Cascadia Mono", "SF Mono", Consolas, "DejaVu Sans Mono", monospace;
  --f-digit: "Saira Semi Condensed", "IBM Plex Mono", "Cascadia Mono", Consolas, monospace;
  --r: 6px; --ui: 1;
  color-scheme: dark;
}
:root[data-tone="light"] { --ok: #1F8A5B; --warn: #A66E00; --bad: #C8352B; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 calc(13px * var(--ui))/1.35 var(--f-ui); overflow: hidden; display: flex; flex-direction: column; }
button, select, input { font: inherit; color: inherit; }
h4 { margin: 10px 0 2px; font: 600 calc(10.5px * var(--ui))/1.2 var(--f-label); letter-spacing: .12em; text-transform: uppercase; color: var(--ink3); }
h4:first-child { margin-top: 0; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
[hidden] { display: none !important; }
small, .note { color: var(--ink3); font-size: .9em; }

/* верхняя панель */
.rail { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 6px max(12px, env(safe-area-inset-right, 0px)) 6px max(12px, env(safe-area-inset-left, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); z-index: 5; }
.brand { font: 700 calc(15px * var(--ui))/1 var(--f-label); letter-spacing: .34em; color: var(--ink); padding-right: 4px; }
.brand i { color: var(--accent); font-style: normal; }
#devs { display: flex; gap: 6px; flex-wrap: wrap; }
.devchip { display: flex; align-items: center; gap: 7px; padding: 3px 4px 3px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--raised); font-size: .92em; }
.devchip b { font-weight: 600; } .devchip small { color: var(--ink3); }
.tag { font: 600 .74em/1 var(--f-label); letter-spacing: .1em; padding: 2px 5px; border-radius: 3px; background: var(--accent); color: var(--on-accent); }
.lamp { width: 8px; height: 8px; border-radius: 50%; background: var(--ink3); flex: none; }
.lamp.ok { background: var(--ok); box-shadow: 0 0 6px var(--ok); } .lamp.warn { background: var(--warn); } .lamp.bad { background: var(--bad); }
#tabs { display: flex; gap: 2px; flex: 1; min-width: 180px; overflow-x: auto; }
#tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 12px; color: var(--ink2); cursor: pointer; white-space: nowrap; }
#tabs button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
#tabs button:hover { color: var(--ink); }
.rail-r { display: flex; gap: 6px; }

/* кнопки */
.btn, .tbtn, .tgl { border: 1px solid var(--line); background: var(--raised); border-radius: 4px; cursor: pointer; }
.btn { padding: 5px 12px; font-weight: 500; }
.tbtn, .tgl { padding: 2px 8px; font-size: .92em; }
.btn:hover, .tbtn:hover, .tgl:hover { border-color: var(--ink3); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
.btn.primary.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }
.tgl[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.wbtn { border: 0; background: none; width: 22px; height: 22px; border-radius: 3px; color: var(--ink3); cursor: pointer; padding: 0; line-height: 1; font-size: 15px; flex: none; }
.wbtn:hover { background: var(--line); color: var(--ink); }
.lnk { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; max-width: 100%; }
.seg.wrap { flex-wrap: wrap; }
.seg button { border: 0; border-right: 1px solid var(--line); background: var(--raised); padding: 3px 9px; cursor: pointer; white-space: nowrap; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.seg button:disabled { opacity: .35; cursor: not-allowed; }
.stepper { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.stepper button { width: 30px; border: 0; background: var(--raised); cursor: pointer; font-size: 16px; }
.stepper button:hover { background: var(--line); }
.st-val { flex: 1; text-align: center; padding: 3px 4px; font: 600 1em var(--f-mono); background: var(--screen); color: var(--screen-ink); }
select, input { background: var(--raised); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; min-width: 0; }
input:focus, select:focus { border-color: var(--accent); }
.field { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.field > span { font: 600 .8em/1.2 var(--f-label); letter-spacing: .08em; color: var(--ink3); text-transform: uppercase; }
.row { display: flex; gap: 6px; align-items: center; min-width: 0; }
.row.wrap { flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 8px; height: 100%; min-height: 0; }
.pad { padding: 8px 10px; }
.scroll { overflow: auto; flex: 1; min-height: 0; }
.chip { padding: 2px 7px; border-radius: 3px; background: var(--raised); border: 1px solid var(--line); font-size: .9em; }
.chip.bad { background: var(--bad); color: #fff; border-color: var(--bad); }

/* стол и окна */
#desks { flex: 1; position: relative; min-height: 0; }
.desk { position: absolute; inset: 0; overflow: auto; background-image: radial-gradient(color-mix(in srgb, var(--ink3) 26%, transparent) 1px, transparent 1.2px); background-size: 16px 16px; }
.win { position: absolute; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 1px 0 color-mix(in srgb, var(--ink) 7%, transparent) inset, 0 6px 16px rgba(0, 0, 0, .28); container-type: inline-size; }
:root[data-tone="light"] .win { box-shadow: 0 1px 0 #fff inset, 0 4px 12px rgba(40, 50, 60, .14); }
.win.max { border-radius: 0; }
.win.rec .win-bar { box-shadow: inset 0 -2px 0 var(--bad); }
.win-bar { display: flex; align-items: center; gap: 7px; min-height: 30px; padding: 2px 4px 2px 9px; border-bottom: 1px solid var(--line); cursor: move; user-select: none; touch-action: none; }
.win-title { font: 600 calc(11px * var(--ui))/1 var(--f-label); letter-spacing: .1em; text-transform: uppercase; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.win-tools { margin-left: auto; display: flex; gap: 4px; align-items: center; min-width: 0; cursor: default; }
.win-tools select { max-width: 150px; padding: 1px 4px; font-size: .9em; }
.win-body { flex: 1; min-height: 0; overflow: hidden; position: relative; display: flex; flex-direction: column; }
.rz { position: absolute; z-index: 2; touch-action: none; }
.rz-n, .rz-s { left: 8px; right: 8px; height: 6px; cursor: ns-resize; } .rz-n { top: -3px; } .rz-s { bottom: -3px; }
.rz-e, .rz-w { top: 8px; bottom: 8px; width: 6px; cursor: ew-resize; } .rz-e { right: -3px; } .rz-w { left: -3px; }
.rz-ne, .rz-nw, .rz-se, .rz-sw { width: 12px; height: 12px; } .rz-ne { top: -3px; right: -3px; cursor: nesw-resize; } .rz-nw { top: -3px; left: -3px; cursor: nwse-resize; } .rz-sw { bottom: -3px; left: -3px; cursor: nesw-resize; }
.rz-se { bottom: -3px; right: -3px; cursor: nwse-resize; background: linear-gradient(135deg, transparent 55%, var(--ink3) 56%, var(--ink3) 62%, transparent 63%, transparent 72%, var(--ink3) 73%, var(--ink3) 79%, transparent 80%); }
.nodev { margin: auto; text-align: center; display: grid; gap: 10px; color: var(--ink2); padding: 16px; }

/* показание */
.win-body > * { flex: 1 1 auto; min-height: 0; }
.reading { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; min-height: 0; overflow: auto; container-type: size; }
.rd-head { display: flex; gap: 10px; align-items: center; color: var(--ink2); min-width: 0; }
.rd-head select { flex: 1; }
.rd-head span { color: var(--ink3); }
.big { flex: 1 1 56px; min-height: 56px; display: flex; align-items: baseline; justify-content: flex-end; gap: .35em; padding: 4px 12px; background: var(--screen); color: var(--screen-ink); border: 1px solid var(--line); border-radius: 4px; box-shadow: inset 0 2px 8px rgba(0, 0, 0, .35); overflow: hidden; font-size: clamp(30px, min(13.5cqw, 48cqh), 190px); }
.digits { font: 600 1em/1 var(--f-digit); font-variant-numeric: tabular-nums; letter-spacing: -.01em; white-space: nowrap; margin-top: auto; margin-bottom: auto; }
.unit { font: 500 .36em/1 var(--f-label); color: var(--screen-ink); opacity: .86; white-space: nowrap; margin-top: auto; margin-bottom: auto; }
:root[data-glow="1"] .digits { text-shadow: 0 0 .18em color-mix(in srgb, var(--screen-ink) 55%, transparent); }
.segs { height: .92em; width: auto; display: block; fill: var(--screen-ink); }
.segs .off { fill: var(--screen-ink); opacity: .07; }
:root[data-glow="1"] .segs { filter: drop-shadow(0 0 .06em color-mix(in srgb, var(--screen-ink) 60%, transparent)); }
.over .big { color: var(--bad); } .over .segs { fill: var(--bad); }
.bargraph { position: relative; height: 10px; flex: none; background: var(--screen); border: 1px solid var(--line); border-radius: 2px; overflow: hidden; }
.bargraph.thin { height: 3px; border: 0; border-radius: 0; }
.bargraph .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); transition: width .08s linear; }
.bargraph .ticks { position: absolute; inset: 0; background-image: repeating-linear-gradient(90deg, transparent 0 calc(5% - 1px), color-mix(in srgb, var(--bg) 70%, transparent) calc(5% - 1px) 5%); }
.stats { display: flex; flex-wrap: wrap; gap: 2px 14px; align-items: baseline; flex: none; }
.stats div { display: flex; gap: 5px; align-items: baseline; }
.stats span { color: var(--ink3); font-size: .86em; }
.stats b { font: 500 .96em var(--f-mono); font-variant-numeric: tabular-nums; }
.fn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 4px; flex: none; }
.fn-grid button { border: 1px solid var(--line); background: var(--raised); border-radius: 4px; padding: 5px 4px; cursor: pointer; }
.fn-grid button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
.dmm .big { flex-basis: 74px; font-size: clamp(30px, min(12cqw, 26cqh), 150px); }
.ctl-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 6px 12px; flex: none; }
.ctl-grid .seg { flex-wrap: wrap; width: fit-content; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 6px; }
.tiles.small { flex: none; }
.tile { background: var(--raised); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; display: flex; flex-direction: column; min-width: 0; }
.tile span { display: flex; justify-content: space-between; align-items: center; color: var(--ink3); font: 600 .84em/1.2 var(--f-label); letter-spacing: .06em; }
.tile b { font: 600 1.28em/1.2 var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
.tile .wbtn { width: 16px; height: 16px; font-size: 13px; }

/* таблица */
table.grid { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
.grid th { position: sticky; top: 0; background: var(--panel); text-align: left; font: 600 .82em/1.2 var(--f-label); letter-spacing: .06em; color: var(--ink3); padding: 5px 8px; border-bottom: 1px solid var(--line); z-index: 1; }
.grid td { padding: 3px 8px; border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent); white-space: nowrap; }
.grid .num { text-align: right; font-family: var(--f-mono); }
.grid .strong { font-weight: 600; }

/* графики */
.chart-wrap { flex: 1; min-height: 0; position: relative; }
.chart { position: absolute; inset: 0; cursor: crosshair; touch-action: none; }
canvas.plot { display: block; }
.win-body > .legend { flex: none; }
.legend { display: flex; flex-wrap: wrap; gap: 2px 12px; padding: 4px 10px; color: var(--ink2); }
.lg { display: inline-flex; align-items: center; gap: 5px; }
.lg i, .tip i { width: 12px; height: 3px; border-radius: 2px; display: inline-block; }
.tip { position: absolute; pointer-events: none; background: var(--raised); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; z-index: 3; box-shadow: 0 4px 10px rgba(0, 0, 0, .3); font-size: .92em; }
.tip div { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.tip b { margin-left: auto; padding-left: 12px; font: 600 1em var(--f-mono); }

/* осциллограф */
.scope { display: grid; grid-template-columns: minmax(0, 1fr) 196px; height: 100%; min-height: 0; }
@container (max-width: 560px) { .scope { grid-template-columns: 1fr; grid-template-rows: minmax(220px, 1fr) auto; overflow: auto; } .sc-ctl { border-left: 0 !important; border-top: 1px solid var(--line); max-height: none !important; } }
.sc-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.sc-screen { flex: 3; min-height: 120px; position: relative; cursor: crosshair; touch-action: none; overflow: hidden; }
.sc-fft { flex: 1.3; min-height: 80px; position: relative; border-top: 1px solid var(--line); overflow: hidden; display: flex; flex-direction: column; }
.sc-fft[hidden] { display: none; }
.fx-sp, .fx-wf { position: relative; min-height: 50px; overflow: hidden; cursor: crosshair; touch-action: none; }
.fx-wf { border-top: 1px solid var(--line); }
.fx-wf[hidden] { display: none; }
.fx-sp canvas, .fx-wf canvas { position: absolute; left: 0; top: 0; }
.fx-res { flex: none; display: flex; flex-wrap: wrap; gap: 4px; padding: 3px 8px; border-top: 1px solid var(--line); max-height: 58px; overflow-y: auto; }
.fx-res:empty { display: none; }
.mchip.mk b, .mchip.pk { font-family: var(--f-mono); }
.mchip .wbtn.on { color: var(--accent); }
.fx-ctl { gap: 5px; }
.fx-ctl[hidden] { display: none; }
.sc-ctl .note { color: var(--ink3); font-size: .86em; margin: 4px 0 0; }
.sc-meas { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px 8px; border-top: 1px solid var(--line); min-height: 30px; }
.mchip { display: inline-flex; align-items: center; gap: 5px; background: var(--raised); border: 1px solid var(--line); border-radius: 3px; padding: 1px 2px 1px 7px; color: var(--ink2); font-size: .92em; }
.mchip b { font: 600 1em var(--f-mono); color: var(--ink); }
.mchip.cur { padding-right: 7px; font-family: var(--f-mono); }
.mchip .wbtn { width: 16px; height: 16px; font-size: 13px; }
.sc-info { padding: 2px 8px 4px; color: var(--ink3); font: 400 .86em var(--f-mono); min-height: 1.5em; }
.sc-ctl { border-left: 1px solid var(--line); padding: 8px; display: flex; flex-direction: column; gap: 5px; overflow-y: auto; }
.sc-ctl > * { flex: none; }
.sc-ctl .row .btn { flex: 1; padding: 5px 4px; }
.sc-ctl .seg { width: 100%; } .sc-ctl .seg button { flex: 1; padding: 3px 2px; }
.sc-state { font-size: .92em; color: var(--ink2); }
.sc-state[data-s="WAIT"] { color: var(--warn); } .sc-state[data-s="TD"] { color: var(--ok); }

/* консоль и формы */
.cons { display: flex; flex-direction: column; height: 100%; gap: 6px; padding: 6px 8px 8px; }
.cons-log { background: var(--screen); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; font: 400 .96em/1.4 var(--f-mono); color: var(--screen-ink); }
.cons-log div { white-space: pre-wrap; word-break: break-word; }
.c-in { color: var(--t2); } .c-ok { color: var(--ink3); } .c-err { color: var(--bad); }
.cons-in { flex: 1; font-family: var(--f-mono); }
.set-row { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 3px 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 50%, transparent); }
.set-row > div:first-child { min-width: 0; display: flex; flex-direction: column; }
.set-row input { width: 110px; } .set-row select { max-width: 180px; }
.checks label { display: block; padding: 1px 0; }
.qlist { padding: 4px 10px; }
.qrow { display: flex; gap: 6px; align-items: center; padding: 3px 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 50%, transparent); }
.qrow > div { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.qform { display: grid; grid-template-columns: 1fr 120px 96px; gap: 5px; padding: 8px 10px; border-top: 1px solid var(--line); }
.qform input:nth-child(4) { grid-column: 1 / 3; }
.qform .btn { grid-column: 1 / -1; }
.lcd-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
canvas.lcd { max-width: 100%; max-height: 100%; aspect-ratio: 3/2; background: var(--screen); border: 1px solid var(--line); cursor: pointer; }
.preview { max-height: 45%; overflow: auto; padding: 8px; text-align: center; } .preview img { max-width: 100%; }

/* диалоги */
dialog { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 0; width: min(760px, calc(100vw - 24px)); max-height: calc(100vh - 32px); box-shadow: 0 20px 50px rgba(0, 0, 0, .5); }
dialog::backdrop { background: rgba(0, 0, 0, .45); }
.dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.dlg-head h3 { margin: 0; font: 600 1.1em var(--f-ui); }
.dlg-body { padding: 14px 16px; overflow: auto; max-height: calc(100vh - 110px); display: flex; flex-direction: column; gap: 12px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
.card { text-align: left; background: var(--raised); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
.card:hover:not(:disabled) { border-color: var(--accent); }
.card:disabled { opacity: .55; cursor: not-allowed; }
.card b { font-weight: 600; } .card small { line-height: 1.3; }
details { color: var(--ink2); } summary { cursor: pointer; color: var(--ink); }
details p { margin-top: 6px; max-width: 66ch; }
.themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(146px, 1fr)); gap: 8px; }
.th { border: 2px solid transparent; border-radius: 6px; padding: 0; cursor: pointer; overflow: hidden; background: none; text-align: left; }
.th.on { border-color: var(--accent); }
.th-view { display: flex; align-items: center; justify-content: space-between; padding: 12px 10px; height: 58px; font: 600 22px var(--f-digit); }
.th-view i { display: flex; gap: 3px; } .th-view i u { width: 5px; height: 16px; border-radius: 1px; display: block; }
.th-name { display: block; padding: 4px 8px; font-size: .92em; }
#toasts { position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 6px; z-index: 50; max-width: min(420px, calc(100vw - 24px)); }
.toast { background: var(--raised); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 4px; padding: 7px 10px; box-shadow: 0 6px 16px rgba(0, 0, 0, .35); }
.toast.bad { border-left-color: var(--bad); } .toast.warn { border-left-color: var(--warn); } .toast.ok { border-left-color: var(--ok); }

/* узкий экран: окна идут одной колонкой */
@media (max-width: 719px) {
  body { overflow: auto; }
  .desk { position: static; overflow: visible; display: flex; flex-direction: column; gap: 10px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
  #desks { overflow: visible; }
  .win { position: relative; left: 0 !important; top: 0 !important; width: 100% !important; height: auto !important; min-height: 280px; }
  .win-body { min-height: 240px; height: 60vh; }
  .rz { display: none; }
  .win-bar { cursor: default; }
  #tabs { order: 5; flex-basis: 100%; }
}
@media (prefers-reduced-motion: reduce) { .bargraph .fill { transition: none; } }
/* tinySA */
.sa-f { width: 9.5em; }
.sa-n { width: 7.5em; }

<div id="toasts" aria-live="polite"></div>
<script>'use strict';
/* Пульт: общие помощники, хранилище настроек, шина величин. Без зависимостей. */

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'value') e.value = v;
    else if (k === 'checked' || k === 'disabled' || k === 'selected' || k === 'hidden') e[k] = !!v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}

const store = {
  get(k, d) { try { const v = localStorage.getItem('pult.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('pult.' + k, JSON.stringify(v)); } catch { /* приватное окно */ } },
};

class Emitter {
  constructor() { this.l = new Map(); }
  on(ev, fn) { if (!this.l.has(ev)) this.l.set(ev, new Set()); this.l.get(ev).add(fn); return () => this.l.get(ev).delete(fn); }
  emit(ev, ...a) { const s = this.l.get(ev); if (s) for (const f of [...s]) { try { f(...a); } catch (e) { console.error(e); } } }
}

/* ---------- единицы и числа ---------- */
const UNIT_RU = { V: 'В', A: 'А', 'Ω': 'Ом', F: 'Ф', H: 'Гн', Hz: 'Гц', W: 'Вт', VA: 'ВА', var: 'вар', Wh: 'Вт·ч', s: 'с' };
const PREFIX_RU = { G: 'Г', M: 'М', k: 'к', '': '', m: 'м', 'µ': 'мк', n: 'н', p: 'п' };
const opts = { ruUnits: store.get('ruUnits', true) };

function unitText(prefix, unit) {
  if (!opts.ruUnits) return prefix + unit;
  const base = UNIT_RU[unit];
  return base === undefined ? prefix + unit : (PREFIX_RU[prefix] ?? prefix) + base;
}

const SI = [[1e9, 'G'], [1e6, 'M'], [1e3, 'k'], [1, ''], [1e-3, 'm'], [1e-6, 'µ'], [1e-9, 'n'], [1e-12, 'p']];
const NO_PREFIX = new Set(['°C', '°F', '°', '%', '', 'Wh', 'PF', 'dBm', 'dB']);

/* Разбивает число на мантиссу и приставку. digits: значащих цифр. */
function siParts(v, unit, digits = 6) {
  if (v === null || v === undefined || Number.isNaN(v)) return { text: '-----', unit: unitText('', unit), over: false, none: true };
  if (!Number.isFinite(v) || Math.abs(v) >= 9.8e37) return { text: 'OL', unit: unitText('', unit), over: true };
  if (NO_PREFIX.has(unit)) {
    const a = Math.abs(v), dec = a >= 1000 ? 1 : a >= 100 ? 2 : a >= 10 ? 3 : 4;
    return { text: v.toFixed(Math.max(0, Math.min(dec, digits - 1))), unit };
  }
  const a = Math.abs(v);
  let m = 1, p = '';
  if (a !== 0) { for (const [f, s] of SI) { if (a >= f * 0.99999) { m = f; p = s; break; } m = f; p = s; } }
  const x = v / m, ax = Math.abs(x);
  const lead = ax >= 100 ? 3 : ax >= 10 ? 2 : 1;
  return { text: x.toFixed(Math.max(0, digits - lead)), unit: unitText(p, unit) };
}
function fmtSI(v, unit = '', digits = 5) { const p = siParts(v, unit, digits); return p.unit ? p.text + ' ' + p.unit : p.text; }

/* Шаг 1-2-5 вокруг значения. */
function step125(v, dir, lo = 1e-12, hi = 1e12) {
  const e = Math.floor(Math.log10(v) + 1e-9), m = v / 10 ** e;
  const list = [1, 2, 5, 10];
  let i = list.findIndex(x => m <= x * 1.0001);
  if (i < 0) i = 3;
  if (Math.abs(m - list[i]) > 0.001 * m && dir > 0) i -= 1;
  const n = list[i + dir] ?? (dir > 0 ? 20 : 0.5);
  return clamp(n * 10 ** e, lo, hi);
}

function niceTicks(lo, hi, n = 5) {
  if (!(hi > lo)) { hi = lo + 1; lo -= 1; }
  const span = hi - lo, raw = span / n, mag = 10 ** Math.floor(Math.log10(raw));
  const nice = [1, 2, 2.5, 5, 10].find(x => x * mag >= raw) * mag;
  const start = Math.ceil(lo / nice - 1e-9) * nice, out = [];
  for (let v = start; v <= hi + nice * 1e-6; v += nice) out.push(Math.abs(v) < nice * 1e-9 ? 0 : v);
  return out;
}

function logTicks(lo, hi) {
  const out = [];
  for (let e = Math.floor(Math.log10(lo)); e <= Math.ceil(Math.log10(hi)); e++) for (const m of [1, 2, 5]) {
    const v = m * 10 ** e;
    if (v >= lo * 0.999 && v <= hi * 1.001) out.push({ v, major: m === 1 });
  }
  return out;
}

function saveFile(name, data, type = 'text/plain') {
  const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], { type }));
  const a = h('a', { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function stamp() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}

function toast(text, kind = 'info', ms = 4200) {
  const box = $('#toasts');
  if (!box) return;
  const t = h('div', { class: 'toast ' + kind, role: 'status' }, text);
  box.append(t);
  setTimeout(() => t.remove(), ms);
}

/* ---------- величины ---------- */
const HIST = 40000;

class Quantity {
  constructor(def) {
    Object.assign(this, { id: def.id, name: def.name, unit: def.unit ?? '', dev: def.dev ?? '', group: def.group ?? '', hint: def.hint ?? '', digits: def.digits ?? 6, full: def.full ?? 0, custom: def.custom });
    this.t = new Float64Array(HIST); this.v = new Float64Array(HIST);
    this.n = 0; this.head = 0; this.last = NaN; this.lastT = 0; this.flags = '';
    this.resetStats();
  }
  resetStats() { this.cnt = 0; this.min = Infinity; this.max = -Infinity; this.mean = 0; this.m2 = 0; }
  push(v, t) {
    this.t[this.head] = t; this.v[this.head] = v;
    this.head = (this.head + 1) % HIST; if (this.n < HIST) this.n++;
    this.last = v; this.lastT = t;
    if (Number.isFinite(v) && Math.abs(v) < 9e37) {
      this.cnt++; if (v < this.min) this.min = v; if (v > this.max) this.max = v;
      const d = v - this.mean; this.mean += d / this.cnt; this.m2 += d * (v - this.mean);
    }
  }
  get sd() { return this.cnt > 1 ? Math.sqrt(this.m2 / (this.cnt - 1)) : 0; }
  at(i) { const k = (this.head - this.n + i + HIST * 2) % HIST; return [this.t[k], this.v[k]]; }
  clear() { this.n = 0; this.head = 0; this.last = NaN; this.resetStats(); }
}

const Hub = new (class extends Emitter {
  constructor() { super(); this.q = new Map(); this.rev = 0; }
  define(def) {
    let q = this.q.get(def.id);
    if (q) { Object.assign(q, { name: def.name ?? q.name, unit: def.unit ?? q.unit, full: def.full ?? q.full, hint: def.hint ?? q.hint }); return q; }
    q = new Quantity(def); this.q.set(def.id, q); this.rev++; this.emit('defs'); return q;
  }
  remove(id) { if (this.q.delete(id)) { this.rev++; this.emit('defs'); } }
  removeDev(dev) { for (const q of [...this.q.values()]) if (q.dev === dev) this.q.delete(q.id); this.rev++; this.emit('defs'); }
  push(id, v, t = performance.now()) { const q = this.q.get(id); if (q) { q.push(v, t); this.emit('sample', q, v, t); } }
  list() { return [...this.q.values()]; }
})();

/* ---------- вычисляемые величины: x = выражение от других ---------- */
const Calc = {
  items: store.get('calc', []),
  compile(expr) {
    if (!/^[\w\s.+\-*/()%^,:]*$/.test(expr)) throw new Error('В выражении есть недопустимые символы');
    const names = [...new Set(expr.match(/[a-zA-Z_][\w.]*:?[\w.]*/g) || [])].filter(n => !Object.getOwnPropertyNames(Math).includes(n));
    const body = expr.replace(/\^/g, '**').replace(/[a-zA-Z_][\w.]*:?[\w.]*/g, m => names.includes(m) ? `g(${JSON.stringify(m)})` : `Math.${m}`);
    return new Function('g', `return (${body});`);
  },
  save() { store.set('calc', this.items); },
};

/* Транспорты. Общий контракт:
     open(), close(), send(str|bytes), recv(timeoutMs) -> Uint8Array одного ответа.
   Text и блоки IEEE 488.2 разбираются здесь и в Link, драйверы видят только SCPI. */

const enc = new TextEncoder(), dec = new TextDecoder('latin1');
const toBytes = s => typeof s === 'string' ? enc.encode(s) : s;

class TimeoutError extends Error { constructor(m = 'Прибор не ответил вовремя') { super(m); this.name = 'TimeoutError'; } }

/* ---------- USBTMC поверх WebUSB ---------- */
class UsbTmc extends Emitter {
  static label = 'USB';
  static get available() { return !!navigator.usb; }
  static filters = [
    { vendorId: 0x1209, productId: 0xD040 },       // DM40 с opendm40
    { vendorId: 0x2E3C, productId: 0x5721 },       // LT1 с прошивкой fix5 (2.0 и новее)
    { classCode: 0xFE, subclassCode: 3 },          // любой USBTMC-прибор
  ];
  constructor(device) { super(); this.dev = device; this.tag = 1; this.kind = 'usb'; this.name = device?.productName || 'USB'; }
  static async pick() { return new UsbTmc(await navigator.usb.requestDevice({ filters: UsbTmc.filters })); }

  findIface() {
    for (const cfg of this.dev.configurations) for (const i of cfg.interfaces) for (const a of i.alternates)
      if (a.interfaceClass === 0xFE && a.interfaceSubclass === 3) return { cfg, iface: i, alt: a };
    return null;
  }
  async open() {
    const d = this.dev;
    await d.open();
    if (!d.configuration) await d.selectConfiguration(d.configurations[0].configurationValue);
    const f = this.findIface();
    if (!f) throw new Error('У устройства нет интерфейса USBTMC');
    if (d.configuration.configurationValue !== f.cfg.configurationValue) await d.selectConfiguration(f.cfg.configurationValue);
    this.ifn = f.iface.interfaceNumber;
    await d.claimInterface(this.ifn);
    if (f.alt.alternateSetting) await d.selectAlternateInterface(this.ifn, f.alt.alternateSetting);
    for (const e of f.alt.endpoints) {
      if (e.type !== 'bulk') continue;
      if (e.direction === 'in') { this.epIn = e.endpointNumber; this.mpsIn = e.packetSize; }
      else { this.epOut = e.endpointNumber; this.mpsOut = e.packetSize; }
    }
    if (!this.epIn || !this.epOut) throw new Error('Не найдены конечные точки USBTMC');
    await this.clear().catch(() => { });
  }
  async close() { try { await this.dev.releaseInterface(this.ifn); } catch { } try { await this.dev.close(); } catch { } }

  /* USBTMC INITIATE_CLEAR + CHECK_CLEAR_STATUS: сбрасывает хвосты прошлой сессии. */
  async clear() {
    const setup = (request, length) => ({ requestType: 'class', recipient: 'interface', request, value: 0, index: this.ifn });
    await this.dev.controlTransferIn(setup(5), 1);
    for (let i = 0; i < 20; i++) {
      const r = await this.dev.controlTransferIn(setup(6), 2);
      const s = r.data?.getUint8(0);
      if (s === 1) break;
      if (s !== 2) break;
      await sleep(5);
    }
    await this.dev.clearHalt('out', this.epOut).catch(() => { });
    await this.dev.clearHalt('in', this.epIn).catch(() => { });
    this.tag = 1;
  }
  nextTag() { const t = this.tag; this.tag = t === 255 ? 1 : t + 1; return t; }
  async send(data) {
    const b = toBytes(data), t = this.nextTag();
    const pad = (4 - (b.length & 3)) & 3;
    const m = new Uint8Array(12 + b.length + pad), v = new DataView(m.buffer);
    m[0] = 1; m[1] = t; m[2] = ~t & 255; v.setUint32(4, b.length, true); m[8] = 1;
    m.set(b, 12);
    await this.dev.transferOut(this.epOut, m);
  }
  async recv(timeout = 3000) {
    const parts = []; let total = 0, eom = false;
    const deadline = performance.now() + timeout;
    while (!eom) {
      const t = this.nextTag(), rq = new Uint8Array(12), v = new DataView(rq.buffer);
      const want = 1 << 16;
      rq[0] = 2; rq[1] = t; rq[2] = ~t & 255; v.setUint32(4, want, true);
      await this.dev.transferOut(this.epOut, rq);
      let need = -1, got = 0, first = true, pad = 0;
      while (need < 0 || got < need) {
        const left = deadline - performance.now();
        if (left <= 0) { await this.abort(); throw new TimeoutError(); }
        // Заголовок читаем одним пакетом, остальное точным числом байт: ответ кратной
        // длины не обязан заканчиваться коротким пакетом, и transferIn иначе зависнет.
        const size = first ? this.mpsIn : Math.max(this.mpsIn, Math.ceil((need - got + pad) / this.mpsIn) * this.mpsIn);
        const r = await withTimeout(this.dev.transferIn(this.epIn, size), left).catch(async e => { await this.abort(); throw e; });
        if (r.status !== 'ok') { await this.dev.clearHalt('in', this.epIn).catch(() => { }); throw new Error('USB: ' + r.status); }
        let u = new Uint8Array(r.data.buffer, r.data.byteOffset, r.data.byteLength);
        if (first) {
          if (u.length < 12 || u[0] !== 2 || u[1] !== t) continue;   // хвост прошлого ответа
          const dv = new DataView(u.buffer, u.byteOffset, 12);
          need = dv.getUint32(4, true); eom = !!(u[8] & 1); first = false; pad = (4 - (need & 3)) & 3;
          u = u.subarray(12);
        }
        if (got + u.length > need) u = u.subarray(0, need - got);
        if (u.length) { parts.push(u.slice()); got += u.length; total += u.length; }
        if (need === 0) break;
      }
    }
    return joinBytes(parts, total);
  }
  async abort() { try { await this.clear(); } catch { } }
}

function joinBytes(parts, total) {
  if (parts.length === 1) return parts[0];
  const o = new Uint8Array(total); let p = 0;
  for (const x of parts) { o.set(x, p); p += x.length; }
  return o;
}
function withTimeout(promise, ms) {
  let id;
  return Promise.race([promise, new Promise((_, rej) => { id = setTimeout(() => rej(new TimeoutError()), ms); })]).finally(() => clearTimeout(id));
}

/* ---------- поток байт -> ответы (строка до \n или блок #N) ---------- */
class StreamParser {
  constructor() { this.buf = new Uint8Array(1 << 16); this.len = 0; this.wait = null; }
  feed(u) {
    if (this.len + u.length > this.buf.length) {
      const n = new Uint8Array(Math.max(this.buf.length * 2, this.len + u.length)); n.set(this.buf.subarray(0, this.len)); this.buf = n;
    }
    this.buf.set(u, this.len); this.len += u.length;
    if (this.wait) { const w = this.wait; this.wait = null; w(); }
  }
  flush() { this.len = 0; }
  take() {
    const b = this.buf, n = this.len;
    if (!n) return null;
    if (b[0] === 0x23) {                                  // #<d><len><data>\n
      if (n < 2) return null;
      const d = b[1] - 48;
      if (d === 0) { let i = 2; while (i < n && b[i] !== 10) i++; if (i >= n) return null; return this.cut(i + 1); }
      if (n < 2 + d) return null;
      const size = parseInt(dec.decode(b.subarray(2, 2 + d)), 10);
      const end = 2 + d + size;
      if (n < end) return null;
      return this.cut(n > end && b[end] === 10 ? end + 1 : end);
    }
    const i = b.subarray(0, n).indexOf(10);
    return i < 0 ? null : this.cut(i + 1);
  }
  cut(k) { const o = this.buf.slice(0, k); this.buf.copyWithin(0, k, this.len); this.len -= k; return o; }
  async next(timeout) {
    const end = performance.now() + timeout;
    for (; ;) {
      const m = this.take();
      if (m) return m;
      const left = end - performance.now();
      if (left <= 0) throw new TimeoutError();
      await new Promise(r => { const id = setTimeout(() => { this.wait = null; r(); }, left); this.wait = () => { clearTimeout(id); r(); }; });
    }
  }
}

/* ---------- Web Serial: кабельный COM-порт и Bluetooth SPP ---------- */
const SPP_UUID = '00001101-0000-1000-8000-00805f9b34fb';

class SerialLink extends Emitter {
  static label = 'COM / Bluetooth SPP';
  static get available() { return !!navigator.serial; }
  constructor(port, baud = 115200) { super(); this.port = port; this.baud = baud; this.parser = new StreamParser(); this.kind = 'serial'; this.name = 'COM-порт'; }
  static async pick(baud) {
    const o = {};
    try { o.allowedBluetoothServiceClassIds = [SPP_UUID]; return new SerialLink(await navigator.serial.requestPort(o), baud); }
    catch (e) { if (e.name === 'TypeError') return new SerialLink(await navigator.serial.requestPort(), baud); throw e; }
  }
  async open() {
    await this.port.open({ baudRate: this.baud, bufferSize: 1 << 16 });
    this.writer = this.port.writable.getWriter();
    this.alive = true;
    this.pump();
    const info = this.port.getInfo?.() || {};
    if (info.bluetoothServiceClassId) { this.name = 'Bluetooth SPP'; this.kind = 'bt'; }
    await this.send('\n');
    await sleep(60); this.parser.flush();
  }
  async pump() {
    while (this.alive && this.port.readable) {
      this.reader = this.port.readable.getReader();
      try {
        for (; ;) { const { value, done } = await this.reader.read(); if (done) break; if (value) this.parser.feed(value); }
      } catch (e) { if (this.alive) this.emit('lost', e); break; } finally { this.reader.releaseLock(); }
    }
  }
  async close() {
    this.alive = false;
    try { await this.reader?.cancel(); } catch { }
    try { this.writer?.releaseLock(); } catch { }
    try { await this.port.close(); } catch { }
  }
  async send(data) { const s = typeof data === 'string' && !data.endsWith('\n') ? data + '\n' : data; await this.writer.write(toBytes(s)); }
  recv(timeout = 3000) { return this.parser.next(timeout); }
  abort() { this.parser.flush(); }
}

/* ---------- Web Bluetooth: BLE-канал модуля. Служба заранее не задокументирована,
   поэтому перебираем известные UART-службы и берём характеристики по их свойствам. */
const BLE_SERVICES = [
  '6e400001-b5a3-f393-e0a9-e50e24dcca9e',            // Nordic UART
  0xFFE0, 0xFFF0, 0xFF00, 0xFF10, 0xFFE5, 0xAE00, 0xAE30, 0xFEE7, 0xFFB0, 0xFFC0, 0xFFD0, 0xFD00, 0x18F0,
  '49535343-fe7d-4ae5-8fa9-9fafd205e455',            // ISSC/Microchip
  '0000fff0-0000-1000-8000-00805f9b34fb',
];

class BleLink extends Emitter {
  static label = 'Bluetooth LE';
  static get available() { return !!navigator.bluetooth; }
  constructor(device) { super(); this.dev = device; this.parser = new StreamParser(); this.kind = 'bt'; this.name = device?.name || 'BLE'; this.mtu = 20; }
  static async pick() {
    return new BleLink(await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'DM40' }, { namePrefix: 'C-1-ATK' }, { namePrefix: 'LT1' }, { namePrefix: 'ATK' }, { namePrefix: 'C2' }],
      optionalServices: BLE_SERVICES,
    }));
  }
  async open() {
    this.dev.addEventListener('gattserverdisconnected', () => this.emit('lost', new Error('Bluetooth отключился')));
    const srv = await this.dev.gatt.connect();
    const services = await srv.getPrimaryServices();
    for (const s of services) {
      let tx = null, rx = null;
      for (const c of await s.getCharacteristics()) {
        if (!rx && (c.properties.notify || c.properties.indicate)) rx = c;
        if (!tx && (c.properties.writeWithoutResponse || c.properties.write)) tx = c;
      }
      if (tx && rx) { this.tx = tx; this.rx = rx; this.service = s.uuid; break; }
    }
    if (!this.tx) throw new Error('В приборе не найден канал обмена BLE. Подключитесь через Bluetooth SPP.');
    this.rx.addEventListener('characteristicvaluechanged', e => { const d = e.target.value; this.parser.feed(new Uint8Array(d.buffer, d.byteOffset, d.byteLength)); });
    await this.rx.startNotifications();
  }
  async close() { try { await this.rx?.stopNotifications(); } catch { } try { this.dev.gatt.disconnect(); } catch { } }
  async send(data) {
    const b = toBytes(typeof data === 'string' && !data.endsWith('\n') ? data + '\n' : data);
    for (let i = 0; i < b.length; i += this.mtu) {
      const part = b.subarray(i, i + this.mtu);
      if (this.tx.properties.writeWithoutResponse) await this.tx.writeValueWithoutResponse(part); else await this.tx.writeValue(part);
    }
  }
  recv(timeout = 4000) { return this.parser.next(timeout); }
  abort() { this.parser.flush(); }
}

/* ---------- мост WebSocket: для браузеров без WebUSB/Web Serial (tools/bridge.py) ---------- */
class WsLink extends Emitter {
  static label = 'Мост WebSocket';
  static get available() { return true; }
  constructor(url) { super(); this.url = url; this.parser = new StreamParser(); this.kind = 'ws'; this.name = url; }
  open() {
    return new Promise((res, rej) => {
      const w = this.ws = new WebSocket(this.url); w.binaryType = 'arraybuffer';
      w.onopen = () => res(); w.onerror = () => rej(new Error('Мост не отвечает: ' + this.url));
      w.onclose = () => this.emit('lost', new Error('Мост закрыт'));
      w.onmessage = e => this.parser.feed(typeof e.data === 'string' ? enc.encode(e.data) : new Uint8Array(e.data));
    });
  }
  async close() { try { this.ws.close(); } catch { } }
  async send(data) { this.ws.send(toBytes(typeof data === 'string' && !data.endsWith('\n') ? data + '\n' : data)); }
  recv(timeout = 3000) { return this.parser.next(timeout); }
  abort() { this.parser.flush(); }
}

/* ---------- Link: очередь запросов с приоритетом, счётчики, разбор блоков ---------- */
class Link extends Emitter {
  constructor(tr) {
    super(); this.tr = tr; this.q = [[], []]; this.running = false;
    this.bytes = 0; this.msgs = 0; this.errors = 0; this.log = null;
    tr.on?.('lost', e => this.emit('lost', e));
  }
  run(fn, prio = 1) {
    return new Promise((res, rej) => { this.q[prio].push({ fn, res, rej }); this.pump(); });
  }
  async pump() {
    if (this.running) return;
    this.running = true;
    for (; ;) {
      const j = this.q[0].shift() || this.q[1].shift();
      if (!j) break;
      try { j.res(await j.fn()); } catch (e) { this.errors++; j.rej(e); }
    }
    this.running = false;
  }
  tx(cmd) { this.log?.('tx', cmd); return this.tr.send(cmd); }
  async rx(timeout) {
    const b = await this.tr.recv(timeout);
    this.bytes += b.length; this.msgs++;
    return b;
  }
  write(cmd, prio = 0) { return this.run(() => this.tx(cmd), prio); }
  query(cmd, { timeout = 3000, prio = 1 } = {}) {
    return this.run(async () => {
      await this.tx(cmd);
      const s = dec.decode(await this.rx(timeout)).trim();
      this.log?.('rx', s);
      return s;
    }, prio);
  }
  /* Ответ-блок: возвращает только данные. */
  block(cmd, { timeout = 5000, prio = 1 } = {}) {
    return this.run(async () => {
      await this.tx(cmd);
      const b = await this.rx(timeout);
      this.log?.('rx', `[блок ${b.length} байт]`);
      return parseBlock(b);
    }, prio);
  }
  async num(cmd, o) { return parseFloat(await this.query(cmd, o)); }
}

function parseBlock(b) {
  if (b[0] !== 0x23) return new Uint8Array(0);
  const d = b[1] - 48;
  if (d <= 0) return new Uint8Array(0);
  const size = parseInt(dec.decode(b.subarray(2, 2 + d)), 10);
  return b.subarray(2 + d, 2 + d + size);
}

/* ======================= ALIENTEK C2: бинарный протокол EE =======================
   Не SCPI. Кадр в обе стороны: EE cmd len payload[len] ck, в ответе ещё хвост FF.
   ck = (-сумма байт от EE до конца payload) & 0xFF. По USB каждый кадр в своём
   пакете 64 байта, по Bluetooth кадры идут потоком, поэтому режем по EE и len. */
const C2P = {
  cksum(b, n) { let s = 0; for (let i = 0; i < n; i++) s += b[i]; return (-s) & 0xFF; },
  frame(cmd, payload = []) {
    const p = payload instanceof Uint8Array ? payload : Uint8Array.from(payload);
    const f = new Uint8Array(4 + p.length);
    f[0] = 0xEE; f[1] = cmd & 0xFF; f[2] = p.length; f.set(p, 3);
    f[3 + p.length] = C2P.cksum(f, 3 + p.length);
    return f;
  },
  reply(cmd, payload) { const f = C2P.frame(cmd, payload), o = new Uint8Array(f.length + 1); o.set(f); o[f.length] = 0xFF; return o; },
};
const c2hex = u => Array.from(u, b => b.toString(16).padStart(2, '0')).join(' ');

/* Поток байт -> кадры EE. Интерфейс как у StreamParser: feed, flush, next. */
class C2Frame {
  constructor() { this.buf = new Uint8Array(1 << 12); this.len = 0; this.wait = null; this.bad = 0; }
  feed(u) {
    if (this.len + u.length > this.buf.length) {
      const n = new Uint8Array(Math.max(this.buf.length * 2, this.len + u.length)); n.set(this.buf.subarray(0, this.len)); this.buf = n;
    }
    this.buf.set(u, this.len); this.len += u.length;
    if (this.wait) { const w = this.wait; this.wait = null; w(); }
  }
  flush() { this.len = 0; }
  drop(k) { this.buf.copyWithin(0, k, this.len); this.len -= k; }
  take() {
    for (; ;) {
      let i = 0;
      while (i < this.len && this.buf[i] !== 0xEE) i++;   // ресинхронизация и паддинг USB-пакета
      if (i) this.drop(i);
      if (this.len < 4) return null;
      const L = this.buf[2], cmd = this.buf[1], need = 4 + L;
      if (L > 59 || cmd < 1 || cmd > 0x22) { this.bad++; this.drop(1); continue; }   // кадр C2 всегда помещается в 64 байта; 0x21, 0x22 приходят сами
      if (this.len < need) return null;
      if (this.buf[3 + L] !== C2P.cksum(this.buf, 3 + L)) { this.bad++; this.drop(1); continue; }
      const out = this.buf.slice(0, need);
      this.drop(this.len > need && this.buf[need] === 0xFF ? need + 1 : need);
      return out;
    }
  }
  async next(timeout) {
    const end = performance.now() + timeout;
    for (; ;) {
      const m = this.take();
      if (m) return m;
      const left = end - performance.now();
      if (left <= 0) throw new TimeoutError();
      await new Promise(r => { const id = setTimeout(() => { this.wait = null; r(); }, left); this.wait = () => { clearTimeout(id); r(); }; });
    }
  }
}

/* WebUSB, вендорный интерфейс C2 (bulk OUT 0x01, IN 0x82, 64 байта, Full-Speed).
   Чтение идёт непрерывно и не ждёт запросов: так поток измерений не упирается в
   пинг-понг и шина работает на пределе Full-Speed. */
class UsbVendor extends Emitter {
  static label = 'USB';
  static get available() { return !!navigator.usb; }
  static filters = [{ vendorId: 0x2E88, productId: 0xC2C2 }, { vendorId: 0x2E88 }];
  static match(d) { return d?.vendorId === 0x2E88; }
  constructor(device) { super(); this.dev = device; this.kind = 'usb'; this.proto = 'c2'; this.name = device?.productName || 'USB'; this.parser = new C2Frame(); this.rxBytes = 0; }
  static async pick() { return new UsbVendor(await navigator.usb.requestDevice({ filters: UsbVendor.filters })); }
  findIface() {
    for (const cfg of this.dev.configurations) for (const i of cfg.interfaces) for (const a of i.alternates) {
      let bi = 0, bo = 0, mps = 64;
      for (const e of a.endpoints) {
        if (e.type !== 'bulk') continue;
        if (e.direction === 'in') { bi = e.endpointNumber; mps = e.packetSize || 64; } else bo = e.endpointNumber;
      }
      if (a.interfaceClass === 0xFF && bi && bo) return { cfg, iface: i, alt: a, bi, bo, mps };
    }
    return null;
  }
  async open() {
    const d = this.dev;
    await d.open();
    if (!d.configuration) await d.selectConfiguration(d.configurations[0].configurationValue);
    const f = this.findIface();
    if (!f) throw new Error('У устройства нет вендорного интерфейса C2');
    if (d.configuration.configurationValue !== f.cfg.configurationValue) await d.selectConfiguration(f.cfg.configurationValue);
    this.ifn = f.iface.interfaceNumber;
    await d.claimInterface(this.ifn);
    if (f.alt.alternateSetting) await d.selectAlternateInterface(this.ifn, f.alt.alternateSetting);
    this.epIn = f.bi; this.epOut = f.bo; this.mps = f.mps;
    await d.clearHalt('in', this.epIn).catch(() => { });
    await d.clearHalt('out', this.epOut).catch(() => { });
    this.alive = true;
    this.pump();
  }
  /* Несколько чтений в очереди сразу: прослушка PD идёт потоком ~470 КБ/с, одно чтение за раз её не вытягивает. */
  async pump() {
    const N = 6, size = this.mps * 64, q = [];
    const issue = () => q.push(this.dev.transferIn(this.epIn, size).catch(e => ({ error: e })));
    for (let k = 0; k < N; k++) issue();
    while (this.alive) {
      const r = await q.shift();
      if (!this.alive) return;
      if (r.error) { this.emit('lost', r.error); return; }
      if (r.status === 'stall') { await this.dev.clearHalt('in', this.epIn).catch(() => { }); issue(); continue; }
      if (r.status === 'ok' && r.data?.byteLength) { this.rxBytes += r.data.byteLength; this.parser.feed(new Uint8Array(r.data.buffer, r.data.byteOffset, r.data.byteLength)); }
      else if (r.status !== 'ok' && r.status !== 'babble') { this.emit('lost', new Error('USB: ' + r.status)); return; }
      issue();
    }
  }
  async close() { this.alive = false; try { await this.dev.releaseInterface(this.ifn); } catch { } try { await this.dev.close(); } catch { } }
  async send(data) { const r = await this.dev.transferOut(this.epOut, toBytes(data)); if (r.status === 'stall') { await this.dev.clearHalt('out', this.epOut).catch(() => { }); throw new Error('USB: stall'); } }
  recv(timeout = 3000) { return this.parser.next(timeout); }
  abort() { this.parser.flush(); }
}

/* Канал C2 поверх любого транспорта: одно непрерывное чтение кадров, запросы ждут
   ответ своей командой, все кадры (и непрошеные, например поток измерений) уходят
   событием 'frame'. Для BLE, SPP и моста перед open() ставится parser = C2Frame. */
class C2Link extends Emitter {
  constructor(tr) {
    super(); this.tr = tr; this.alive = false; this.wait = new Map(); this.q = Promise.resolve();
    this.bytes = 0; this.msgs = 0; this.errors = 0; this.log = null;
    tr.on?.('lost', e => { if (this.alive) this.emit('lost', e); });
  }
  start() { if (this.alive) return; this.alive = true; this.loop(); }
  async loop() {
    while (this.alive) {
      let f;
      try { f = await this.tr.recv(1000); }
      catch (e) { if (e instanceof TimeoutError) continue; if (this.alive) { this.errors++; this.emit('lost', e); } return; }
      this.bytes += f.length; this.msgs++;
      const cmd = f[1], payload = f.subarray(3, 3 + f[2]);
      this.log?.('rx', c2hex(f));
      const w = this.wait.get(cmd);
      if (w) { this.wait.delete(cmd); clearTimeout(w.timer); w.res(payload); }
      this.emit('frame', { cmd, payload, raw: f });
    }
  }
  /* Отправки идут строго по очереди, чтобы кадры по Bluetooth не перемешались. */
  send(cmd, payload = []) {
    const fr = C2P.frame(cmd, payload);
    const p = this.q.then(() => { this.log?.('tx', c2hex(fr)); return this.tr.send(fr); });
    this.q = p.catch(() => { });
    return p;
  }
  /* Запросы с одной командой идут по очереди: прибор отвечает кадром с тем же номером,
     и два ожидающих одну команду иначе путали бы ответы (окно калибровки опрашивает 0x1E,
     а дамп памяти шлёт тот же 0x1E). */
  request(cmd, payload = [], o = {}) {
    this.chain ??= new Map();
    const p = (this.chain.get(cmd) || Promise.resolve()).then(() => this.request1(cmd, payload, o));
    this.chain.set(cmd, p.catch(() => { }));
    return p;
  }
  request1(cmd, payload = [], { timeout = 2000 } = {}) {
    return new Promise((res, rej) => {
      const old = this.wait.get(cmd);
      if (old) { clearTimeout(old.timer); old.rej(new Error('Запрос перекрыт новым')); }
      const timer = setTimeout(() => { if (this.wait.get(cmd)?.res === res) { this.wait.delete(cmd); this.errors++; rej(new TimeoutError()); } }, timeout);
      this.wait.set(cmd, { res, rej, timer });
      this.send(cmd, payload).catch(e => { if (this.wait.get(cmd)?.res === res) { clearTimeout(timer); this.wait.delete(cmd); } this.errors++; rej(e); });
    });
  }
  async close() { this.alive = false; for (const w of this.wait.values()) clearTimeout(w.timer); this.wait.clear(); try { await this.tr.close(); } catch { } }
}

/* Симуляторы: отвечают тем же SCPI, что и настоящие приборы, поэтому драйверы и окна
   работают одинаково. Значения вымышленные, в интерфейсе они помечены как демо. */

class SimLink extends Emitter {
  constructor(sim, latency = 3) { super(); this.sim = sim; this.out = []; this.latency = latency; this.kind = 'sim'; this.name = 'Демо'; }
  async open() { } async close() { } abort() { this.out = []; }
  async send(data) {
    const s = typeof data === 'string' ? data : dec.decode(data);
    const reply = this.sim.message(s.trim());
    if (reply !== null) this.out.push(reply);
  }
  async recv(timeout = 3000) {
    await sleep(this.latency);
    if (!this.out.length) throw new TimeoutError();
    const r = this.out.shift();
    return typeof r === 'string' ? enc.encode(r + '\n') : r;
  }
}

function block(u) {
  const n = String(u.length), head = enc.encode(`#${n.length}${n}`), o = new Uint8Array(head.length + u.length + 1);
  o.set(head); o.set(u, head.length); o[o.length - 1] = 10; return o;
}
const nr3 = v => (v >= 0 ? '+' : '') + v.toExponential(6).replace('e+', 'E+').replace('e-', 'E-').replace(/E([+-])(\d)$/, 'E$10$2');
const rnd = s => (Math.random() + Math.random() + Math.random() - 1.5) * s;

class SimBase {
  message(s) {
    const out = [];
    for (const c of s.split(';')) {
      const r = this.cmd(c.trim());
      if (r !== undefined && r !== null) out.push(r);
    }
    if (!out.length) return s.includes('?') ? '' : null;
    if (out.length === 1) return out[0];
    return out.map(x => typeof x === 'string' ? x : dec.decode(x)).join(';');
  }
}

/* ---------- DM40 ---------- */
const SIM_FUNCS = {
  VOLT: () => 3.29872 + rnd(2e-4), 'VOLT:AC': () => 1.20213 + rnd(4e-4), 'VOLT:ACDC': () => 3.5099 + rnd(5e-4), 'VOLT:AUTO': () => 3.2987 + rnd(2e-4),
  CURR: () => 0.024816 + rnd(3e-6), 'CURR:AC': () => 0.01275 + rnd(5e-6), 'CURR:ACDC': () => 0.02793 + rnd(5e-6), 'CURR:AUTO': () => 0.024816 + rnd(3e-6),
  RES: () => 4698.3 + rnd(0.4), CONT: () => 0.183 + rnd(0.01), DIOD: () => 0.6512 + rnd(1e-4), CAP: () => 9.87e-6 + rnd(2e-9),
  FREQ: () => 1000.02 + rnd(0.01), TEMP: () => 24.6 + rnd(0.05), POW: () => 12.41 + rnd(0.02),
};

class SimDM40 extends SimBase {
  constructor() {
    super();
    this.f = 'VOLT'; this.rate = 'FAST'; this.ahold = 0; this.smooth = 0; this.smoothR = 'FAST'; this.limit = [null, null]; this.limitOn = 0; this.neg = 0;
    this.rangeAuto = true; this.range = 6; this.stat = 0; this.bt = 1;
    this.run = true; this.ts = 1e-3; this.vs = 1; this.coup = 'DC'; this.offs = 0; this.tl = 0; this.slope = 'POS'; this.sweep = 'AUTO'; this.src = 'CHAN1'; this.status = 'TD';
    this.wform = 'BYTE'; this.wpts = 'SCR'; this.gf = 'SIN'; this.gfreq = 1000; this.gv = 3; this.goffs = 1.5; this.gduty = 50; this.gout = 1;
    this.frozen = null; this.ph = 0; this.dec = 'OFF'; this.baud = 'AUTO'; this.errors = []; this.temp = 'C'; this.beep = 40; this.logOn = 0;
    this.gensc = 1; this.gendisp = 0;
    this.pow = { p: 12.41, s: 13.9, q: 6.2, pf: 0.893, v: 229.8, i: 0.0605, f: 50.01, e: 0.0351, sec: 102 };
    this.files = [['SHOTS/S000.BMP', 230454], ['LOGS/LOG000.DLG', 18432], ['LOGS/LOG000.CSV', 40210], ['SCOPE/SCOP000.DLG', 53124]];
  }
  srate() { return Math.min(5e7, 40 / this.ts); }
  wave(t) {
    const w = 2 * Math.PI * this.gfreq * t, c = this.gv / 2, d = this.gduty / 100, x = w / (2 * Math.PI) % 1;
    let v = this.gf === 'SIN' ? Math.sin(w) : this.gf === 'SQU' ? (x < d ? 1 : -1) : this.gf === 'TRI' ? (x < .5 ? 4 * x - 1 : 3 - 4 * x) : 2 * x - 1;

  }
  grab(n) {
    const dt = this.ts * 10 / n, o = new Float64Array(n), T = 1 / this.gfreq;

    const jitter = rnd(dt * 0.3);

    const gl = Math.random() < 0.04 ? { at: Math.random() * n | 0, w: 2 + Math.random() * 6, a: (Math.random() < .5 ? -1 : 1) * this.vs * (1 + Math.random() * 1.5) } : null;
    for (let i = 0; i < n; i++) {
      let v = this.wave(t0 + jitter + (i - n / 2) * dt);
      if (this.coup === 'AC') v -= this.gout ? this.goffs : 0;

  pre(points, type) {

  }
  cmd(c) {
    const m = c.match(/^:?(\S+)\s*(.*)$/); if (!m) return null;
    const hd = m[1].toUpperCase(), arg = m[2].trim(), q = hd.endsWith('?'), k = hd.replace(/\?$/, '');
    const a = arg.replace(/"/g, '').toUpperCase(), num = parseFloat(arg);
    const sw = v => /^(ON|1)$/.test(a) ? 1 : /^(OFF|0)$/.test(a) ? 0 : v;
    if (k === '*IDN') return 'Alientek,DM40C,0123456789ABCDEF01234567,opendm40 0.4.16-S2084';

/* Скорость, амплитуда и прочее считаются здесь же, чтобы набор мер не зависел от прибора. */
function waveStats(v, dt) {
  const n = v.length; if (!n) return {};
  let lo = Infinity, hi = -Infinity, sum = 0, sq = 0;
  for (let i = 0; i < n; i++) { const x = v[i]; if (x < lo) lo = x; if (x > hi) hi = x; sum += x; sq += x * x; }
  const avg = sum / n, rms = Math.sqrt(sq / n), mid = (lo + hi) / 2, hyst = (hi - lo) * 0.1;
  let rise = [], fall = 0, high = 0, state = v[0] > mid;
  for (let i = 1; i < n; i++) {
    const x = v[i];
    if (x > mid) high++;
    if (!state && x > mid + hyst) { state = true; const p = v[i - 1], t = i - 1 + (mid - p) / (x - p || 1); rise.push(t); }
    else if (state && x < mid - hyst) { state = false; fall++; }
  }
  let period = NaN;
  if (rise.length >= 2) period = (rise[rise.length - 1] - rise[0]) / (rise.length - 1) * dt;
  const lo10 = lo + (hi - lo) * .1, hi90 = lo + (hi - lo) * .9;
  let riseT = NaN;
  if (rise.length) {
    const c = Math.round(rise[0]); let a = c, b = c;
    while (a > 0 && v[a] > lo10) a--; while (b < n - 1 && v[b] < hi90) b++;
    if (b > a) riseT = (b - a) * dt;
  }
  return { vpp: hi - lo, vmax: hi, vmin: lo, vavg: avg, vrms: rms, vac: Math.sqrt(Math.max(0, sq / n - avg * avg)), freq: 1 / period, period, duty: high / n * 100, rise: riseT };
}

    await this.w(`SWE:SPEED ${speed};SWE:START`);
    try {
      while (this.alive && c.swRun) {
        await sleep(160);
        const st = (await this.q('SWE:STAT?')).split(',');
        const run = +st[0], done = +st[1];
        if (done !== c.swDone || !run) {
          c.swDone = done;
          const d = await this.link.block('SWE:DATA?', { timeout: 4000 });
          const n = Math.floor(d.length / 12), v = new DataView(d.buffer, d.byteOffset, d.length);
          const f = new Float64Array(n), re = new Float64Array(n), im = new Float64Array(n);
          for (let i = 0; i < n; i++) { f[i] = v.getFloat32(i * 12, true); re[i] = v.getFloat32(i * 12 + 4, true); im[i] = v.getFloat32(i * 12 + 8, true); }
          c.sweep = { f, re, im, n, t: Date.now() };
          this.emit('sweep');
        }
        if (!run) break;
      }
    } catch (e) { this.fail(e); }
    c.swRun = 0; this.emit('sweep');
  }
  async stopSweep() { this.s.swRun = 0; await this.w('SWE:STOP'); this.emit('sweep'); }
  windows() { return ['lt1-lcr', 'reading', 'lt1-sweep', 'settings']; }
}

/* ---------- любой SCPI-прибор ---------- */
class GenericScpi extends Device {
  static probe() { return true; }
  id = 'scpi'; title = 'SCPI';
  async start() {
    this.title = this.model || 'SCPI';
    this.id = 'scpi' + Math.random().toString(36).slice(2, 6);
    this.alive = true;
    this.restoreCustom();
    this.loop();
  }
  async loop() {
    while (this.alive) {
      try { await this.pollCustom(performance.now()); } catch (e) { if (!this.alive) return; this.fail(e); await sleep(500); }
      await sleep(50);
    }
  }
  windows() { return ['reading', 'console']; }
}

/* ---------- подключённые приборы ---------- */
const Devices = new (class extends Emitter {
  list = [];
  get(id) { return this.list.find(d => d.id === id); }
  async attach(tr) {
    if (tr.proto === 'c2') return this.attachC2(tr);
    await tr.open();
    const link = new Link(tr);
    let idn, sa = null;
    const usb = tr.port?.getInfo?.() || {};
    /* tinySA: COM-порт 0483:5740 с оболочкой вместо SCPI. Его спрашиваем первым, иначе *IDN? ждёт до таймаута. */
    if (tr.kind === 'sim' ? tr.parser : usb.usbVendorId === 0x0483 && usb.usbProductId === 0x5740) sa = await TinySA.detect(link);
    if (!sa) {
      try { idn = await link.query('*IDN?', { timeout: 2500 }); }
      catch (e) {
        sa = await TinySA.detect(link);
        if (!sa) { await tr.close(); throw new Error('Прибор не ответил на *IDN?. Проверьте кабель и что в приборе включён нужный режим.'); }
      }
    }
    const Cls = sa ? TinySA : [DM40, LT1].find(c => c.probe(idn)) || GenericScpi;
    const dev = new Cls(link, sa ? sa.idn : idn);
    if (sa) { dev.p = sa.p; dev.info = sa.info; }
    const same = this.get(dev.id);
    if (same) await this.remove(same);
    await dev.start();
    this.list.push(dev);
    this.emit('change');
    return dev;
  }
  async attachC2(tr) {
    if (!(tr.parser instanceof C2Frame)) tr.parser = new C2Frame();   // BLE, SPP, мост: кадры EE вместо строк SCPI
    await tr.open();
    const link = new C2Link(tr);
    link.start();
    let info = null;
    for (let i = 0; i < 3 && !info; i++) info = c2Info(await link.request(1, [], { timeout: 1500 }).catch(() => null));
    if (!info) {
      await link.close();
      if (tr.kind === 'usb' || tr.kind === 'ws') {                          // может быть, прибор в загрузчике (прошивка стёрта или запись прервалась)
        const src = tr.kind === 'usb' ? tr.dev : tr.url;
        const lt = c2LoaderTr(tr.kind, src);
        let ok = false;
        try { await lt.open(); ok = !!await c2AfTx(lt, 0x10, 0, undefined, 600, 2); } catch { }
        await lt.close().catch(() => { });
        if (ok) { c2LoaderFound(tr.kind, src); throw new Error('C2 в режиме загрузчика: выберите файл прошивки в открывшемся окне.'); }
      }
      throw new Error('C2 не ответил на запрос сведений. Проверьте кабель или Bluetooth и что прибор включён.');
    }
    const dev = new C2(link, info);
    const same = this.get(dev.id);
    if (same) await this.remove(same);
    try { await dev.start(); } catch (e) { dev.alive = false; dev.offFrame?.(); Hub.removeDev(dev.id); await link.close().catch(() => { }); throw e; }
    this.list.push(dev);
    this.emit('change');
    return dev;
  }
  async remove(dev) {
    this.list = this.list.filter(d => d !== dev);
    await dev.stop();
    this.emit('change');
  }
})();

const SEG = { 0: 'abcdef', 1: 'bc', 2: 'abdeg', 3: 'abcdg', 4: 'bcfg', 5: 'acdfg', 6: 'acdefg', 7: 'abc', 8: 'abcdefg', 9: 'abcdfg', '-': 'g', ' ': '', O: 'abcdef', L: 'def', E: 'adefg', r: 'eg' };
const SEG_PATH = {
  a: 'M2 1h16l-3 3H5z', b: 'M19 2v15l-3-2.2V5z', c: 'M19 19v15l-3-3V21.2z', d: 'M2 35h16l-3-3H5z', e: 'M1 19v15l3-3V21.2z', f: 'M1 2v15l3-2.2V5z', g: 'M2.5 18l2.5-2h10l2.5 2-2.5 2H5z',
};
function segSvg(text) {
  let x = 0, out = '';
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch === '.' || ch === ',') { out += `<circle cx="${x - 1.2}" cy="33.6" r="1.7"/>`; x += 2.2; continue; }
    const on = SEG[ch] ?? '';
    for (const s of 'abcdefg') out += `<path transform="translate(${x})" d="${SEG_PATH[s]}"${on.includes(s) ? '' : ' class="off"'}/>`;
    x += 24;
  }
  return `<svg class="segs" viewBox="0 0 ${x} 36" aria-hidden="true">${out}</svg>`;
}

/* ---------- окна ---------- */
const GRID = 8;
const snap = v => Math.round(v / GRID) * GRID;

class Win {
  constructor(desk, type, cfg, geom) {
    this.desk = desk; this.type = type; this.cfg = cfg || {}; this.def = WM.types[type]; this.subs = [];
    const g = this.geom = { x: 16, y: 16, w: this.def.w || 360, h: this.def.h || 240, ...geom };
    this.titleEl = h('span', { class: 'win-title', text: this.def.title });
    this.lamp = h('i', { class: 'lamp' });
    this.toolbar = h('span', { class: 'win-tools' });
    const bar = h('div', { class: 'win-bar', ondblclick: e => { if (!e.target.closest('button,select,input')) this.toggleMax(); } }, this.lamp, this.titleEl, this.toolbar,
      h('button', { class: 'wbtn', title: 'Развернуть', 'aria-label': 'Развернуть окно', onclick: () => this.toggleMax() }, '▢'),
      h('button', { class: 'wbtn', title: 'Закрыть', 'aria-label': 'Закрыть окно', onclick: () => WM.close(this) }, '×'));
    this.body = h('div', { class: 'win-body' });
    this.el = h('section', { class: 'win', 'aria-label': this.def.title }, bar, this.body);
    for (const d of ['n', 's', 'e', 'w', 'ne', 'nw', 'se', 'sw']) this.el.append(h('b', { class: 'rz rz-' + d, 'data-d': d }));
    this.place();
    this.el.addEventListener('pointerdown', () => WM.front(this), true);
    bar.addEventListener('pointerdown', e => this.startMove(e));
    this.el.addEventListener('pointerdown', e => { if (e.target.classList.contains('rz')) this.startResize(e); });
    this.mount();
  }
  sub(em, ev, fn) { this.subs.push(em.on(ev, fn)); }
  mount() {
    this.teardown();
    const d = this.def, build = () => {
      this.body.replaceChildren(); this.toolbar.replaceChildren();
      if (d.dev) {
        const dev = Devices.get(this.cfg.dev || d.dev);
        this.dev = dev;
        if (!dev) { this.lamp.className = 'lamp'; this.body.append(noDevice(d)); return; }
        this.lamp.className = 'lamp ok';
        this.sub(dev, 'state', () => { this.lamp.className = 'lamp ' + dev.state; });
      }
      this.api = d.make(this, this.dev, this.cfg) || {};
    };
    this.rebuild = () => { this.teardown(); build(); };
    build();
    this.devsub = Devices.on('change', () => {
      if (!d.dev) return;
      const dev = Devices.get(this.cfg.dev || d.dev);
      if (dev !== this.dev) this.rebuild();
    });
  }
  teardown() { this.api?.dispose?.(); this.api = null; for (const s of this.subs) s(); this.subs = []; }
  destroy() { this.teardown(); this.devsub?.(); this.el.remove(); }
  place() { const g = this.geom, s = this.el.style; s.left = g.x + 'px'; s.top = g.y + 'px'; s.width = g.w + 'px'; s.height = g.h + 'px'; }
  title(t) { this.titleEl.textContent = t; }
  toggleMax() {
    if (this.prev) { this.geom = this.prev; this.prev = null; this.el.classList.remove('max'); }
    else { this.prev = { ...this.geom }; const b = this.desk.el; this.geom = { x: b.scrollLeft, y: b.scrollTop, w: b.clientWidth, h: b.clientHeight }; this.el.classList.add('max'); }
    this.place(); WM.save();
  }
  startMove(e) {
    if (e.button || e.target.closest('button,select,input') || WM.narrow()) return;
    e.preventDefault();
    const g = this.geom, x0 = e.clientX, y0 = e.clientY, gx = g.x, gy = g.y, t = e.currentTarget;
    t.setPointerCapture(e.pointerId);
    const mv = ev => { g.x = Math.max(0, snap(gx + ev.clientX - x0)); g.y = Math.max(0, snap(gy + ev.clientY - y0)); this.place(); };
    const up = () => { t.removeEventListener('pointermove', mv); t.removeEventListener('pointerup', up); WM.save(); };
    t.addEventListener('pointermove', mv); t.addEventListener('pointerup', up);
  }
  startResize(e) {
    if (WM.narrow()) return;
    e.preventDefault(); e.stopPropagation();
    const d = e.target.dataset.d, g = this.geom, s = { ...g }, x0 = e.clientX, y0 = e.clientY, t = e.target;
    const minW = 200, minH = 110;
    t.setPointerCapture(e.pointerId);
    const mv = ev => {
      const dx = ev.clientX - x0, dy = ev.clientY - y0;
      if (d.includes('e')) g.w = Math.max(minW, snap(s.w + dx));
      if (d.includes('s')) g.h = Math.max(minH, snap(s.h + dy));
      if (d.includes('w')) { const w = Math.max(minW, snap(s.w - dx)); g.x = Math.max(0, s.x + s.w - w); g.w = w; }
      if (d.includes('n')) { const hh = Math.max(minH, snap(s.h - dy)); g.y = Math.max(0, s.y + s.h - hh); g.h = hh; }
      this.place();
    };
    const up = () => { t.removeEventListener('pointermove', mv); t.removeEventListener('pointerup', up); WM.save(); };
    t.addEventListener('pointermove', mv); t.addEventListener('pointerup', up);
  }
}

const WM = {
  types: {}, desks: [], cur: 0, z: 10,

  },
  close(w) { w.destroy(); const d = w.desk; d.wins = d.wins.filter(x => x !== w); this.save(); },
  front(w) { if (w.el.style.zIndex !== String(this.z)) w.el.style.zIndex = ++this.z; },
  addDesk(name, layout = []) {
    const d = { name, wins: [], el: h('div', { class: 'desk', hidden: true }) };
    $('#desks').append(d.el);
    this.desks.push(d);
    const keep = this.cur; this.cur = this.desks.length - 1;
    for (const l of layout) if (this.types[l.type]) { const w = new Win(d, l.type, l.cfg, l.g); d.wins.push(w); d.el.append(w.el); }
    this.cur = keep;
    return d;
  },
  show(i) {
    this.cur = clamp(i, 0, this.desks.length - 1);
    this.desks.forEach((d, k) => { d.el.hidden = k !== this.cur; });
    Bus.emit('desk');
    store.set('desk', this.cur);
  },
  removeDesk(i) {
    if (this.desks.length < 2) return;
    const [d] = this.desks.splice(i, 1);
    for (const w of d.wins) w.destroy();
    d.el.remove();
    this.show(Math.min(this.cur, this.desks.length - 1)); this.save();
  },
  layout() { return this.desks.map(d => ({ name: d.name, wins: d.wins.map(w => ({ type: w.type, cfg: w.cfg, g: w.prev || w.geom })) })); },
  save() { if (this.loading) return; clearTimeout(this.t); this.t = setTimeout(() => store.set('layout', this.layout()), 200); },
  load(list) {
    this.loading = true;
    for (const d of [...this.desks]) { for (const w of d.wins) w.destroy(); d.el.remove(); }
    this.desks = [];
    for (const d of list) this.addDesk(d.name, d.wins);
    this.loading = false;
    this.show(clamp(store.get('desk', 0), 0, this.desks.length - 1));
    Bus.emit('desks');
  },
};

class Plot {
  constructor(box, cls = '') {
    this.c = h('canvas', { class: 'plot ' + cls }); box.append(this.c);
    this.g = this.c.getContext('2d', { alpha: true });

    this.fit();

  fit() {
    const r = this.box.getBoundingClientRect(), d = devicePixelRatio || 1;
    const w = Math.max(10, Math.round(r.width)), hh = Math.max(10, Math.round(r.height));
    if (w === this.w && hh === this.h) return;
    this.w = w; this.h = hh; this.c.width = w * d; this.c.height = hh * d; this.c.style.width = w + 'px'; this.c.style.height = hh + 'px';
    this.g.setTransform(d, 0, 0, d, 0, 0); this.dirty = true; this.onresize?.();
  }
  dispose() { this.ro.disconnect(); }
}
const pad = n => String(n).padStart(2, '0');

function seg(options, value, onchange, label) {
  const box = h('div', { class: 'seg', role: 'radiogroup', 'aria-label': label });

    const b = h('button', { role: 'radio', title, onclick: () => { set(v); onchange(v); } }, text);
    b.dataset.v = v; btns.push(b); box.append(b);
  }
  function set(v) { for (const b of btns) { const on = b.dataset.v === String(v); b.classList.toggle('on', on); b.setAttribute('aria-checked', on); } }
  set(value); box.set = set; box.btns = btns;
  return box;
}
function field(label, ...kids) { return h('label', { class: 'field' }, h('span', { text: label }), ...kids); }
function select(options, value, onchange, label) {
  const s = h('select', { 'aria-label': label, onchange: () => onchange(s.value) });
  for (const [v, t] of options) s.append(h('option', { value: v, text: t }));
  s.value = value; return s;
}
function toggle(text, on, onchange) {
  const b = h('button', { class: 'tgl', 'aria-pressed': on ? 'true' : 'false', onclick: () => { const v = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', v); onchange(v); } }, text);

}
/* Числовое поле с шагом 1-2-5 или любым. */
function stepper(value, fmt, onstep, label) {

WM.define('trend', {
  title: 'Тренд', w: 640, h: 340,
  make(win, _, cfg) {
    cfg.ids ??= Hub.list().slice(0, 2).map(q => q.id); cfg.span ??= 60;
    let frozenAt = null, hover = null;
    const box = h('div', { class: 'chart' }), legend = h('div', { class: 'legend' }), tip = h('div', { class: 'tip', hidden: true });
    const add = qSelect('', () => { });
    add.prepend(h('option', { value: '', text: 'Добавить…' })); add.value = '';
    add.addEventListener('change', () => { if (add.value && !cfg.ids.includes(add.value)) { cfg.ids.push(add.value); leg(); WM.save(); } add.value = ''; });
    const pause = toggle('Пауза', false, v => { frozenAt = v ? performance.now() : null; });
    win.toolbar.append(add, pause, h('button', { class: 'tbtn', onclick: exportCsv }, 'CSV'));
    win.body.append(legend, h('div', { class: 'chart-wrap' }, box, tip));
    const p = new Plot(box);
    function leg() {
      legend.replaceChildren();
      cfg.ids.forEach((id, i) => {
        const q = Hub.q.get(id);
        legend.append(h('span', { class: 'lg' }, h('i', { style: { background: Theme.colors.t[i % 4] } }), q ? q.name : id,
          h('button', { class: 'wbtn', 'aria-label': 'Убрать дорожку', onclick: () => { cfg.ids = cfg.ids.filter(x => x !== id); leg(); WM.save(); } }, '×')));
      });
    }
    leg();
    win.sub(Bus, 'theme', leg); win.sub(Hub, 'defs', () => { add.fill(); leg(); });
    function exportCsv() {
      const rows = [];
      for (const id of cfg.ids) { const q = Hub.q.get(id); if (!q) continue; for (let i = 0; i < q.n; i++) { const [t, v] = q.at(i); rows.push(`${q.name};${(t / 1000).toFixed(3)};${v}`); } }
      saveFile(`trend-${stamp()}.csv`, 'Величина;Время, с;Значение\n' + rows.join('\n'), 'text/csv');
    }
    box.addEventListener('wheel', e => { e.preventDefault(); cfg.span = clamp(cfg.span * (e.deltaY > 0 ? 1.25 : .8), 2, 7200); WM.save(); }, { passive: false });
    let drag = null;
    box.addEventListener('pointerdown', e => { if (!frozenAt) return; drag = { x: e.clientX, at: frozenAt }; box.setPointerCapture(e.pointerId); });
    box.addEventListener('pointermove', e => {
      const r = box.getBoundingClientRect(); hover = { x: e.clientX - r.left, y: e.clientY - r.top };
      if (drag) frozenAt = Math.min(performance.now(), drag.at - (e.clientX - drag.x) / (p.w - 72) * cfg.span * 1000);
    });
    box.addEventListener('pointerup', () => { drag = null; });
    box.addEventListener('pointerleave', () => { hover = null; tip.hidden = true; });

    function draw() {
      const g = p.g, W = p.w, H = p.h, c = Theme.colors, end = frozenAt ?? performance.now(), spanMs = cfg.span * 1000, start = end - spanMs;
      g.clearRect(0, 0, W, H);
      const ids = cfg.ids.filter(id => Hub.q.has(id)), n = ids.length, L = 62, R = 10, T = 4, B = 20, plotH = H - T - B, gap = 8;
      if (!n) { g.fillStyle = c.ink3; g.font = FONT(12); g.fillText('Добавьте величину в меню окна', 16, 24); return; }
      const laneH = (plotH - gap * (n - 1)) / n, X = t => L + (t - start) / spanMs * (W - L - R);
      g.font = FONT(10);
      // время
      g.textAlign = 'center'; g.fillStyle = c.ink3;
      const secs = niceTicks(0, cfg.span, Math.max(3, W / 110 | 0));
      for (const s of secs) { const x = X(end - s * 1000); g.strokeStyle = c.grid; g.lineWidth = 1; g.beginPath(); g.moveTo(x + .5, T); g.lineTo(x + .5, H - B); g.stroke(); g.fillText(s ? `−${s}с` : 'сейчас', x, H - 6); }
      const tipRows = [];
      ids.forEach((id, li) => {
        const q = Hub.q.get(id), y0 = T + li * (laneH + gap);
        let lo = Infinity, hi = -Infinity, first = -1;
        for (let i = 0; i < q.n; i++) { const [t, v] = q.at(i); if (t < start || t > end || !Number.isFinite(v) || Math.abs(v) > 9e37) continue; if (first < 0) first = i; if (v < lo) lo = v; if (v > hi) hi = v; }
        if (lo === Infinity) { lo = 0; hi = 1; }
        const m = (hi - lo) * .08 || Math.abs(hi) * .01 || 1; lo -= m; hi += m;
        const Y = v => y0 + laneH - (v - lo) / (hi - lo) * laneH;
        g.strokeStyle = c.line; g.lineWidth = 1; g.strokeRect(L + .5, y0 + .5, W - L - R, laneH);
        g.textAlign = 'right';
        for (const v of niceTicks(lo, hi, Math.max(2, laneH / 34 | 0))) { const y = Y(v); if (y < y0 + 6 || y > y0 + laneH - 4) continue; g.strokeStyle = c.grid; g.beginPath(); g.moveTo(L, y + .5); g.lineTo(W - R, y + .5); g.stroke(); g.fillStyle = c.ink3; g.fillText(fmtSI(v, q.unit, 3), L - 5, y + 3); }
        // по одному столбцу min-max на пиксель, иначе длинная история рисуется медленно
        g.save(); g.beginPath(); g.rect(L, y0, W - L - R, laneH); g.clip();
        const color = c.t[cfg.ids.indexOf(id) % 4]; g.strokeStyle = color; g.lineWidth = 2; g.lineJoin = 'round'; g.beginPath();
        let col = -1, mn = 0, mx = 0, pen = false, nearest = null;
        const hx = hover ? hover.x : -1;
        const flush = () => { if (col < 0) return; if (!pen) { g.moveTo(col, Y(mn)); pen = true; } g.lineTo(col, Y(mn)); if (mx !== mn) g.lineTo(col, Y(mx)); };
        for (let i = Math.max(0, first); first >= 0 && i < q.n; i++) {
          const [t, v] = q.at(i); if (t > end) break; if (!Number.isFinite(v) || Math.abs(v) > 9e37) { flush(); col = -1; pen = false; continue; }
          const x = Math.round(X(t));
          if (hover && (!nearest || Math.abs(X(t) - hx) < Math.abs(nearest[0] - hx))) nearest = [X(t), v, t];
          if (x !== col) { flush(); col = x; mn = mx = v; } else { if (v < mn) mn = v; if (v > mx) mx = v; }
        }
        flush(); g.stroke(); g.restore();
        if (nearest) {
          tipRows.push(h('div', {}, h('i', { style: { background: color } }), q.name, h('b', { text: fmtSI(nearest[1], q.unit, 6) })));
          g.fillStyle = color; g.strokeStyle = c.panel; g.lineWidth = 2; g.beginPath(); g.arc(nearest[0], Y(nearest[1]), 4, 0, 6.3); g.fill(); g.stroke();
        }
      });
      if (hover && hover.x >= L && tipRows.length) {
        g.strokeStyle = c.ink3; g.lineWidth = 1; g.setLineDash([3, 3]); g.beginPath(); g.moveTo(hover.x + .5, T); g.lineTo(hover.x + .5, H - B); g.stroke(); g.setLineDash([]);
        tip.replaceChildren(...tipRows); tip.hidden = false;
        tip.style.left = Math.min(hover.x + 12, W - 180) + 'px'; tip.style.top = Math.min(hover.y + 12, H - 30 - tipRows.length * 18) + 'px';
      }
    }
    let lastDraw = 0;
    return { tick(now) { if (now - lastDraw > 66 || hover) { lastDraw = now; draw(); } }, dispose() { p.dispose(); } };
  },
});

/* ---------- запись выбранных величин ---------- */
const Recorder = new (class extends Emitter {
  on_ = false; rows = []; ids = []; every = 0; t0 = 0; last = 0;
  start(ids, every) { this.ids = ids; this.every = every; this.rows = []; this.t0 = Date.now(); this.last = 0; this.on_ = true; this.off = Hub.on('sample', q => this.sample(q)); this.emit('state'); }
  sample(q) {
    if (!this.ids.includes(q.id)) return;
    const now = performance.now();
    if (this.every && now - this.last < this.every) return;
    if (!this.every && q.id !== this.ids[0]) return;
    this.last = now;
    this.rows.push([Date.now() - this.t0, ...this.ids.map(id => Hub.q.get(id)?.last ?? NaN)]);
    if (this.rows.length > 2e6) this.stop();
  }
  stop() { this.on_ = false; this.off?.(); this.emit('state'); }
  csv() {
    const names = this.ids.map(id => { const q = Hub.q.get(id); return q ? `${q.name}, ${q.unit}` : id; });
    return ['Время, с;' + names.join(';'), ...this.rows.map(r => [(r[0] / 1000).toFixed(3), ...r.slice(1)].join(';'))].join('\n');
  }
})();

        px[i] = L[Math.max(1, t * 255 | 0)];
      }

    g.drawImage(this.cv, 0, 0, W, H);

    g.font = FONT(10, 600); g.textAlign = 'left'; g.fillStyle = col.ink2;
    g.fillText(`DPO · ${this.n} осц. · ${this.rate.toFixed(0)} осц/с`, 16, 28);

    for (let i = 0; i < bw; i++) { const u = L[Math.max(1, i / (bw - 1) * 255 | 0)]; g.fillStyle = `rgba(${u & 255},${u >> 8 & 255},${u >> 16 & 255},${(u >>> 24) / 255})`; g.fillRect(bx + i, by, 1, 6); }

}
